name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  MOON_FIRMWARE_REF: dev

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Build and run tests
        run: make -C tests clean run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format

      - name: Check formatting
        run: make lint

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout Moon Firmware
        uses: actions/checkout@v4
        with:
          repository: KaraZajac/Moon-Firmware
          ref: ${{ env.MOON_FIRMWARE_REF }}
          path: moon-fw

      - name: Cache Moon Firmware build
        uses: actions/cache@v4
        with:
          path: moon-fw/build
          key: moon-fw-${{ env.MOON_FIRMWARE_REF }}-${{ hashFiles('moon-fw/fbt_options.py', 'moon-fw/SConstruct') }}
          restore-keys: |
            moon-fw-${{ env.MOON_FIRMWARE_REF }}-

      - name: Build Moon Firmware SDK
        run: |
          cd moon-fw
          ./fbt COMPACT=1 SKIP_EXTERNAL=1 updater_package
          SDK_ZIP="$(ls dist/f7-C/flipper-z-f7-sdk-*.zip)"
          echo "SDK_ZIP=${SDK_ZIP}" >> "${GITHUB_ENV}"
          echo "Moon SDK: ${SDK_ZIP}"

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          app-dir: app
          sdk-file: moon-fw/${{ env.SDK_ZIP }}
          sdk-hw-target: f7

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkingpad-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.build-app.outputs.fap-artifacts }}
